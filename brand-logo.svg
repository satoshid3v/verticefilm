<svg width="256" height="256" viewBox="-1 -4 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vertice Codeium - New Brand Logo (Gradient Fire Edition) -->
  <!-- Desarrollado por Vertice Codeium -->
  <defs>
    <!-- Gradiente fuego vertical: amarillo (punta arriba) → rojo (centro) → azul/púrpura (base) -->
    <linearGradient id="fire" x1="12" y1="-3.2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="15%" stop-color="#FFC200"/>
      <stop offset="30%" stop-color="#FF8800"/>
      <stop offset="45%" stop-color="#FF3300"/>
      <stop offset="60%" stop-color="#DD0044"/>
      <stop offset="78%" stop-color="#7718AA"/>
      <stop offset="100%" stop-color="#2233CC"/>
    </linearGradient>
  </defs>

  <!-- Pieza central: La V / Flecha apuntando arriba -->
  <polygon points="6.54,18.64 12,-3.18 17.46,18.64 14.54,19.36 12,9.18 9.46,19.36"
           fill="url(#fire)" />

  <!-- Brazo izquierdo del diamante -->
  <polygon points="7.17,7.75 -0.35,12.77 6.94,20.06 9.06,17.94 4.35,13.23 8.83,10.25"
           fill="url(#fire)" />

  <!-- Brazo derecho del diamante -->
  <polygon points="17.06,20.06 24.35,12.77 16.83,7.75 15.17,10.25 19.65,13.23 14.94,17.94"
           fill="url(#fire)" />
</svg>
